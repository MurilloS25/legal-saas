<h2>Restablece tu contraseña</h2>
<p>Recibimos una solicitud para restablecer la contraseña de tu cuenta en LexCR.</p>
<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next={{ .RedirectTo }}">
    Crear nueva contraseña
  </a>
</p>
<p>Si no solicitaste este cambio, puedes ignorar este correo — tu contraseña actual sigue funcionando.</p>
